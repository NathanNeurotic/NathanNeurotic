<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-labelledby="t d">
  <title id="t">NathanNeurotic — Ripto</title>
  <desc id="d">Animated header: shimmering name, live waveform, rotating tagline: code, design, sound, repair.</desc>

  <defs>
    <!-- Shimmer that slides across the name forever (first stop == last stop → seamless loop) -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="repeat">
      <stop offset="0"    stop-color="#8b5cf6"/>
      <stop offset="0.35" stop-color="#c4b5fd"/>
      <stop offset="0.5"  stop-color="#facc15"/>
      <stop offset="0.65" stop-color="#c4b5fd"/>
      <stop offset="1"    stop-color="#8b5cf6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="640 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8b5cf6" stroke-opacity=".08"/>
    </pattern>

    <clipPath id="card"><rect width="960" height="240" rx="18"/></clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }

      /* waveform */
      .wave rect { transform-box: fill-box; transform-origin: center; animation: eq 1.2s ease-in-out infinite; }
      @keyframes eq { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

      /* rotating tagline: 4 lines x 2s = 8s loop */
      .say { opacity: 0; animation: cycle 8s infinite; }
      .say:nth-of-type(2) { animation-delay: 2s; }
      .say:nth-of-type(3) { animation-delay: 4s; }
      .say:nth-of-type(4) { animation-delay: 6s; }
      @keyframes cycle { 0% { opacity: 0; } 3%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }

      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* floating face buttons */
      .bob { animation: bob 4s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

      /* live dot */
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3); opacity: 0; } }

    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="960" height="240" fill="#0b0a12"/>
    <rect width="960" height="240" fill="url(#grid)"/>
    <rect width="960" height="3" fill="url(#shine)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="239" rx="17.5" fill="none" stroke="#2a1f44"/>

  <!-- status chip -->
  <g transform="translate(60 44)">
    <circle cx="6" cy="6" r="4" fill="#34d399" class="pulse"/>
    <circle cx="6" cy="6" r="4" fill="#34d399"/>
    <text x="20" y="10.5" class="mono" font-size="13" fill="#8b8aa3" letter-spacing="1">ONLINE · PS2 HOMEBREW</text>
  </g>

  <!-- name -->
  <text x="56" y="128" class="sans" font-size="66" font-weight="800" letter-spacing="-1" fill="url(#shine)">NathanNeurotic</text>
  <text x="60" y="158" class="mono" font-size="15" font-weight="700" letter-spacing="9" fill="#facc15">RIPTO</text>

  <!-- rotating tagline -->
  <g class="mono" font-size="18" fill="#d4d4e0">
    <text class="say" x="60" y="204"><tspan fill="#8b5cf6">&gt;</tspan> writing code<tspan class="cur" fill="#facc15">▍</tspan></text>
    <text class="say" x="60" y="204"><tspan fill="#8b5cf6">&gt;</tspan> designing pixels<tspan class="cur" fill="#facc15">▍</tspan></text>
    <text class="say" x="60" y="204"><tspan fill="#8b5cf6">&gt;</tspan> making noise<tspan class="cur" fill="#facc15">▍</tspan></text>
    <text class="say" x="60" y="204"><tspan fill="#8b5cf6">&gt;</tspan> repairing hardware<tspan class="cur" fill="#facc15">▍</tspan></text>
  </g>

  <!-- waveform -->
  <g class="wave" fill="url(#bar)">
    <rect x="620" y="70" width="6" height="80" rx="3" style="animation-delay:-.10s"/>
    <rect x="632" y="70" width="6" height="80" rx="3" style="animation-delay:-.55s"/>
    <rect x="644" y="70" width="6" height="80" rx="3" style="animation-delay:-.30s"/>
    <rect x="656" y="70" width="6" height="80" rx="3" style="animation-delay:-.85s"/>
    <rect x="668" y="70" width="6" height="80" rx="3" style="animation-delay:-.20s"/>
    <rect x="680" y="70" width="6" height="80" rx="3" style="animation-delay:-.70s"/>
    <rect x="692" y="70" width="6" height="80" rx="3" style="animation-delay:-.45s"/>
    <rect x="704" y="70" width="6" height="80" rx="3" style="animation-delay:-1.0s"/>
    <rect x="716" y="70" width="6" height="80" rx="3" style="animation-delay:-.15s"/>
    <rect x="728" y="70" width="6" height="80" rx="3" style="animation-delay:-.60s"/>
    <rect x="740" y="70" width="6" height="80" rx="3" style="animation-delay:-.35s"/>
    <rect x="752" y="70" width="6" height="80" rx="3" style="animation-delay:-.90s"/>
    <rect x="764" y="70" width="6" height="80" rx="3" style="animation-delay:-.25s"/>
    <rect x="776" y="70" width="6" height="80" rx="3" style="animation-delay:-.75s"/>
    <rect x="788" y="70" width="6" height="80" rx="3" style="animation-delay:-.50s"/>
    <rect x="800" y="70" width="6" height="80" rx="3" style="animation-delay:-.05s"/>
    <rect x="812" y="70" width="6" height="80" rx="3" style="animation-delay:-.65s"/>
    <rect x="824" y="70" width="6" height="80" rx="3" style="animation-delay:-.40s"/>
    <rect x="836" y="70" width="6" height="80" rx="3" style="animation-delay:-.95s"/>
    <rect x="848" y="70" width="6" height="80" rx="3" style="animation-delay:-.30s"/>
    <rect x="860" y="70" width="6" height="80" rx="3" style="animation-delay:-.80s"/>
    <rect x="872" y="70" width="6" height="80" rx="3" style="animation-delay:-.12s"/>
    <rect x="884" y="70" width="6" height="80" rx="3" style="animation-delay:-.58s"/>
    <rect x="896" y="70" width="6" height="80" rx="3" style="animation-delay:-.33s"/>
  </g>

  <!-- face buttons -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <g class="bob" style="animation-delay:0s"><path d="M760 198 l9 -16 l9 16 z" stroke="#34d399"/></g>
    <g class="bob" style="animation-delay:-1s"><circle cx="804" cy="190" r="8.5" stroke="#f87171"/></g>
    <g class="bob" style="animation-delay:-2s"><path d="M832 182 l16 16 M848 182 l-16 16" stroke="#60a5fa"/></g>
    <g class="bob" style="animation-delay:-3s"><rect x="872" y="182" width="16" height="16" rx="1.5" stroke="#f472b6"/></g>
  </g>
</svg>
