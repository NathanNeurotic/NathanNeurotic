<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="t d">
  <title id="t">NathanNeurotic — Ripto</title>
  <desc id="d">Animated header: shimmering name, live waveform, rotating tagline: code, design, sound, repair.</desc>

  <defs>
    <!-- Shimmer that slides across the name forever (first stop == last stop → seamless loop) -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="repeat">
      <stop offset="0"    stop-color="#8b5cf6"/>
      <stop offset="0.35" stop-color="#c4b5fd"/>
      <stop offset="0.5"  stop-color="#facc15"/>
      <stop offset="0.65" stop-color="#c4b5fd"/>
      <stop offset="1"    stop-color="#8b5cf6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="640 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8b5cf6" stroke-opacity=".08"/>
    </pattern>

    <clipPath id="card"><rect width="960" height="260" rx="18"/></clipPath>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }

      /* waveform */
      .wave rect { transform-box: fill-box; transform-origin: center; animation: eq 1.2s ease-in-out infinite; }
      @keyframes eq { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }

      /* rotating tagline: 4 lines x 2s = 8s loop */
      .say { opacity: 0; animation: cycle 8s infinite; }
      .say:nth-of-type(2) { animation-delay: 2s; }
      .say:nth-of-type(3) { animation-delay: 4s; }
      .say:nth-of-type(4) { animation-delay: 6s; }
      @keyframes cycle { 0% { opacity: 0; } 3%, 22% { opacity: 1; } 25%, 100% { opacity: 0; } }

      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      /* floating face buttons */
      .bob { animation: bob 4s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

      /* live dot */
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3); opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="960" height="260" fill="#0b0a12"/>
    <rect width="960" height="260" fill="url(#grid)"/>
    <rect width="960" height="3" fill="url(#shine)"/>
  </g>
  <rect x=".5" y=".5" width="959" height="259" rx="17.5" fill="none" stroke="#2a1f44"/>

  <!-- status chip (centered: dot + 176px label ≈ 196px wide) -->
  <g transform="translate(382 30)">
    <circle cx="6" cy="6" r="4" fill="#34d399" class="pulse"/>
    <circle cx="6" cy="6" r="4" fill="#34d399"/>
    <text x="20" y="10.5" class="mono" font-size="13" fill="#8b8aa3" letter-spacing="1">ONLINE · PS2 HOMEBREW</text>
  </g>

  <!-- name -->
  <text x="480" y="112" text-anchor="middle" class="sans" font-size="66" font-weight="800" letter-spacing="-1" fill="url(#shine)">NathanNeurotic</text>

  <!-- △ ○  RIPTO  ✕ □ -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <g class="bob" style="animation-delay:0s"><path d="M380 145 l7 -13 l7 13 z" stroke="#34d399"/></g>
    <g class="bob" style="animation-delay:-1s"><circle cx="412" cy="139" r="7" stroke="#f87171"/></g>
    <g class="bob" style="animation-delay:-2s"><path d="M541 132 l13 13 M554 132 l-13 13" stroke="#60a5fa"/></g>
    <g class="bob" style="animation-delay:-3s"><rect x="566" y="132" width="13" height="13" rx="1.5" stroke="#f472b6"/></g>
  </g>
  <text x="484" y="144" text-anchor="middle" class="mono" font-size="15" font-weight="700" letter-spacing="9" fill="#facc15">RIPTO</text>

  <!-- rotating tagline -->
  <g class="mono" font-size="18" fill="#d4d4e0" text-anchor="middle">
    <text class="say" x="480" y="184"><tspan fill="#8b5cf6">&gt;</tspan> writing code<tspan class="cur" fill="#facc15">▍</tspan></text>
    <text class="say" x="480" y="184"><tspan fill="#8b5cf6">&gt;</tspan> designing pixels<tspan class="cur" fill="#facc15">▍</tspan></text>
    <text class="say" x="480" y="184"><tspan fill="#8b5cf6">&gt;</tspan> making noise<tspan class="cur" fill="#facc15">▍</tspan></text>
    <text class="say" x="480" y="184"><tspan fill="#8b5cf6">&gt;</tspan> repairing hardware<tspan class="cur" fill="#facc15">▍</tspan></text>
  </g>

  <!-- waveform: 32 bars, centered (x 287 → 673) -->
  <g class="wave" fill="url(#bar)">
    <rect x="287" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.10s"/>
    <rect x="299" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.55s"/>
    <rect x="311" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.30s"/>
    <rect x="323" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.85s"/>
    <rect x="335" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.20s"/>
    <rect x="347" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.70s"/>
    <rect x="359" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.45s"/>
    <rect x="371" y="204" width="5" height="34" rx="2.5" style="animation-delay:-1.0s"/>
    <rect x="383" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.15s"/>
    <rect x="395" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.60s"/>
    <rect x="407" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.35s"/>
    <rect x="419" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.90s"/>
    <rect x="431" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.25s"/>
    <rect x="443" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.75s"/>
    <rect x="455" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.50s"/>
    <rect x="467" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.05s"/>
    <rect x="479" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.65s"/>
    <rect x="491" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.40s"/>
    <rect x="503" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.95s"/>
    <rect x="515" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.30s"/>
    <rect x="527" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.80s"/>
    <rect x="539" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.12s"/>
    <rect x="551" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.58s"/>
    <rect x="563" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.33s"/>
    <rect x="575" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.88s"/>
    <rect x="587" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.18s"/>
    <rect x="599" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.68s"/>
    <rect x="611" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.43s"/>
    <rect x="623" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.98s"/>
    <rect x="635" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.23s"/>
    <rect x="647" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.73s"/>
    <rect x="659" y="204" width="5" height="34" rx="2.5" style="animation-delay:-.48s"/>
  </g>
</svg>
